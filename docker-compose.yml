services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ccode-timescaledb
    environment:
      POSTGRES_PASSWORD: ccode
      POSTGRES_DB: ccode
      POSTGRES_USER: ccode
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccode -d ccode"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: ccode-app
    environment:
      TIMESCALE_DSN: postgres://ccode:ccode@timescaledb:5432/ccode
      LOG_LEVEL: INFO
    volumes:
      - parquet_data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale_data:
  parquet_data:
